name: Terraform

on:
  push:
  workflow_dispatch:
    inputs:
      command:
        description: Terraform operation to run
        required: true
        type: choice
        options:
          - plan

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  terraform:
    if: github.ref_name != 'main'

    runs-on: ubuntu-latest

    environment: ${{ github.ref_name }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_availability_zones: ${{ vars.TF_AVAILABILITY_ZONES || '["us-east-1a", "us-east-1b"]' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify AWS OIDC configuration
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [[ -z "${AWS_ROLE_ARN}" ]]; then
            echo "AWS_ROLE_ARN is not available."
            echo "Add AWS_ROLE_ARN as a repository or environment secret."
            exit 1
          fi

          if [[ "${AWS_ROLE_ARN}" != arn:aws:iam::*:role/* ]]; then
            echo "AWS_ROLE_ARN must contain the full IAM role ARN."
            exit 1
          fi

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Create Terraform plan
        run: terraform plan -input=false
